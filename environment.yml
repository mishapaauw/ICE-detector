# ICE-detector conda environment (portable: osx-arm64, osx-64, linux-64).
# Only the tools the pipeline calls directly are pinned; conda resolves the rest.
# Full export of the tested macOS env: envs/ICE-detector.osx-arm64.lock.yml
# Create with: conda env create -f environment.yml   (channel_priority strict recommended)
name: ICE-detector
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - ppanggolin=2.3.2     # pangenome, RGPs, spots (brings mmseqs2, pyrodigal, pyaragorn)
  - macsyfinder=2.1.6    # conjugation systems with CONJScan models
  - hmmer=3.4            # nhmmscan (oriT), hmmsearch (MacSyFinder, integrases)
  - pyaragorn=0.3.0      # tRNA/tmRNA prediction (tRNA proximity)
  - biopython=1.88
  - numpy=2.5
  - pandas=2.3
  - matplotlib-base=3.11 # docs/make_figures.py
  - pytest=9.2
